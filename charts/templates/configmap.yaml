apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "autodidact.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autodidact.labels" . | nindent 4 }}
data:
  {{- range $name, $value := .Values.environmentsVars }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
