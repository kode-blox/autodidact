{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "autodidact.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autodidact.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "autodidact.fullname" . }}
      {{- if ne .Values.gateway.protocol "HTTPS" }}
      sectionName: {{ required "gateway.listenerName is required when gateway.enabled=true" .Values.gateway.listenerName | quote }}
      {{- end }}
  hostnames:
    {{- range .Values.gateway.hosts }}
    - {{ .host | quote }}
    {{- end }}
  rules:
    {{- range .Values.gateway.rules }}
    {{- $path := required "gateway.rules[].path is required when gateway.enabled=true" .path }}
    {{- $pathType := default "PathPrefix" .pathType }}
    {{- $headers := .headers }}
    {{- $backend := default dict .backend }}
    - matches:
        {{- range $method := default (list "") .methods }}
        - path:
            type: {{ $pathType }}
            value: {{ $path | quote }}
          {{- if $method }}
          method: {{ $method | quote }}
          {{- end }}
          {{- with $headers }}
          headers:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- if or .filters .middlewares }}
      filters:
        {{- with .filters }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- range .middlewares }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ . | quote }}
        {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ default (include "autodidact.fullname" $) $backend.name | quote }}
          {{- with $backend.group }}
          group: {{ . | quote }}
          {{- end }}
          {{- with $backend.kind }}
          kind: {{ . | quote }}
          {{- end }}
          {{- with $backend.namespace }}
          namespace: {{ . | quote }}
          {{- end }}
          {{- if or $backend.port (eq (default "Service" $backend.kind) "Service") }}
          port: {{ default $.Values.publicService.port $backend.port }}
          {{- end }}
    {{- end }}
{{- end }}
