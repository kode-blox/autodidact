{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "autodidact.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autodidact.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "autodidact.fullname" . }}
      sectionName: {{ required "gateway.listenerName is required when gateway.enabled=true" .Values.gateway.listenerName | quote }}
  hostnames:
    {{- range .Values.gateway.hosts }}
    - {{ .host | quote }}
    {{- end }}
  rules:
    {{- range .Values.gateway.rules }}
    {{- $backend := .backend | default dict }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ required "gateway.rules[].path is required when gateway.enabled=true" .path | quote }}
      {{- with .middlewares }}
      filters:
        {{- range . }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ . | quote }}
        {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ default (include "autodidact.fullname" $) $backend.name | quote }}
          {{- with $backend.namespace }}
          namespace: {{ . | quote }}
          {{- end }}
          port: {{ default $.Values.publicService.port $backend.port }}
    {{- end }}
{{- end }}
